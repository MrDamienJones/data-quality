# Pre-commit hooks for the data-quality library.
# Install both the commit and push stages with:  pre-commit install
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Standard hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Lint + format. CI runs these same hooks, so keep the ruff version in the
  # dev extra in pyproject.toml equal to this rev.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Secret scanning of the staged changes. CI also scans the full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Shared hooks (only the two that apply to a pure-Python library)
  - repo: https://github.com/MrDamienJones/aws-precommit-hooks
    rev: v1.0.0
    hooks:
      - id: no-real-aws-account-ids
      - id: no-push-from-main

  # Run the test suite before each commit
  - repo: local
    hooks:
      # Uses the active environment's interpreter (your venv, where the
      # package is installed editable), so the tests can import data_quality.
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
